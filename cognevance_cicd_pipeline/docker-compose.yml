# ==============================================================================
# Cognevance Technologies - CI/CD Pipeline Automation System
# Docker Compose Orchestration (Local & Production Deployment)
# ==============================================================================

version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: cognevance-cicd-automation:latest
    container_name: cognevance-automation-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PORT=5000
      - APP_VERSION=1.0.0
      - SECRET_KEY=cognevance-secure-compose-secret-key-change-in-prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - cognevance-network

networks:
  cognevance-network:
    driver: bridge
